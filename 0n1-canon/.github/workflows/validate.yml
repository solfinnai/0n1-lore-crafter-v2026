name: validate-canon
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate seed
        working-directory: 0n1-canon
        run: node scripts/validate.mjs
      - name: Verify submissions inbox
        working-directory: 0n1-canon
        run: node scripts/verify-submissions.mjs
